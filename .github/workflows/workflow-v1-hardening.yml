name: Workflow V1 Hardening

on:
  push:
    branches:
      - feature/workflow-execution-v1-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workflow-v1-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/workflow-execution-v1-hardening
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply integration hardening patch
        run: python3 scripts/workflow-v1-integration-hardening.py

      - name: Run targeted Workflow and Selena regressions
        run: >-
          node --test
          tests/security/creatorWorkflowGateway.test.js
          tests/security/creatorWorkflowReadBoundary.test.js
          tests/security/selenaOrchestrator.test.js
          tests/security/selenaWorkflowAction.test.js
          tests/workflowCreatorIntegration.test.js
          tests/workflowProjectModeIntegration.test.js

      - name: Run full security regressions
        run: npm run test:security

      - name: Run repository tests
        run: node --test tests/*.test.js

      - name: Run Creator shell tests
        run: npm run test:creator-shell

      - name: Build production application
        run: npm run build

      - name: Commit validated source changes
        run: |
          rm -f scripts/workflow-v1-integration-hardening.py
          rm -f .github/workflows/workflow-v1-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit."
            exit 0
          fi
          git commit -m "Harden Creator Workflow V1 integration"
          git push origin HEAD:feature/workflow-execution-v1-hardening
